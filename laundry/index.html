<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="얼룩 종류를 고르면 단계별 세탁법과 추천 제품을 알려 드려요.">
<title>때를 아는 세탁 · 얼룩별 세탁 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7F9; --card:#fff; --ink:#18242C; --sub:#5D6B74; --line:#E3EAEE;
  --sky:#2FA8DC; --sky-d:#1C86B5; --sky-l:#E4F4FB; --mint:#E9F6F1; --warn:#FFF4E5; --warn-ink:#9A5B00;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:16px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:10px;height:48px}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.back svg{width:18px;height:18px}
.brand{font-weight:900;font-size:15px;letter-spacing:-.02em}
.brand span{color:var(--sky)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.chip b{color:var(--sky-d);font-weight:700;margin-right:4px}
.view{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:28px;line-height:1.3;font-weight:900;letter-spacing:-.03em}
h2{font-size:22px;line-height:1.35;font-weight:900;letter-spacing:-.03em;margin-bottom:6px}
.lead{color:var(--sub);font-size:15px;line-height:1.6}
.eyebrow{font-size:12px;font-weight:700;color:var(--sky-d);letter-spacing:.04em;margin-bottom:6px}

/* home */
.hero{background:var(--card);border-radius:28px;padding:28px 22px 24px;border:1px solid var(--line);text-align:center;margin-top:8px}
.hero .art{display:flex;justify-content:center;gap:4px;margin:6px 0 18px}
.hero .art img{height:84px;width:auto}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 22px}
.rule{background:var(--sky-l);border-radius:14px;padding:12px 6px;font-size:12.5px;font-weight:700;line-height:1.35;color:var(--sky-d)}
.rule i{display:block;font-style:normal;font-size:20px;margin-bottom:4px}
.cta{width:100%;height:56px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta.sky{background:var(--sky)}
.ghost{width:100%;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px}
.foot{margin-top:auto;padding-top:28px;text-align:center;font-size:11.5px;color:#9AA7AF;line-height:1.6}

/* lists */
.list{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.opt{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;transition:border-color .15s,transform .12s}
.opt:hover{border-color:var(--sky)}
.opt:active{transform:scale(.985)}
.num{flex:none;font-size:12px;font-weight:900;color:var(--sky-d);background:var(--sky-l);border-radius:8px;padding:4px 7px;min-width:34px;text-align:center}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.opt .t small{display:block;font-size:13px;color:var(--sub);margin-top:3px;line-height:1.45}
.opt .thumb{flex:none;width:64px;height:64px;border-radius:14px;background:var(--mint);display:grid;place-items:center}
.opt .thumb img{max-width:50px;max-height:50px}
.arrow{flex:none;color:#B5C1C8}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .12s;position:relative}
.tile:hover{border-color:var(--sky)}
.tile:active{transform:scale(.98)}
.tile .pic{height:96px;border-radius:14px;background:var(--mint);display:grid;place-items:center}
.tile .pic img{max-width:78%;max-height:76px}
.tile .num{position:absolute;top:20px;left:18px}
.tile b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.tile small{font-size:12px;color:var(--sub);line-height:1.4;margin-top:-6px}
.tile .split{position:absolute;top:20px;right:18px;font-size:10.5px;font-weight:700;color:#fff;background:var(--sky);border-radius:6px;padding:3px 6px}

/* question */
.qart{background:var(--card);border:1px solid var(--line);border-radius:24px;height:170px;display:grid;place-items:center;margin:4px 0 18px}
.qart img{max-height:130px;max-width:70%}

/* steps */
.progress{display:flex;gap:5px;margin:4px 0 16px}
.progress span{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .25s}
.progress span.on{background:var(--sky)}
.stepcard{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 20px 24px;min-height:330px;display:flex;flex-direction:column}
.stepcard .pic{height:150px;border-radius:18px;background:var(--mint);display:grid;place-items:center;margin-bottom:20px}
.stepcard .pic img{max-height:118px;max-width:70%}
.stepno{font-size:13px;font-weight:900;color:var(--sky-d);margin-bottom:8px}
.stepno em{font-style:normal;color:#A9B6BE;font-weight:500}
.steptext{font-size:19px;line-height:1.6;font-weight:500;letter-spacing:-.02em;word-break:keep-all}
.notes{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.note{border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.55;word-break:keep-all;display:flex;gap:8px}
.note.w{background:var(--warn);color:var(--warn-ink)}
.note.t{background:var(--sky-l);color:var(--sky-d)}
.note b{flex:none}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
.nav .ghost,.nav .cta{height:54px}
.dots{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.mini{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--sub);line-height:1.5;padding:8px 4px;text-align:left;width:100%;border-radius:10px}
.mini.cur{color:var(--ink);font-weight:500;background:var(--card)}
.mini i{flex:none;font-style:normal;font-weight:900;font-size:12px;color:var(--sky-d);width:34px}

/* result */
.done{text-align:center;margin:6px 0 16px}
.done .badge{display:inline-block;font-size:12px;font-weight:700;color:var(--sky-d);background:var(--sky-l);border-radius:999px;padding:6px 12px;margin-bottom:10px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;margin-bottom:14px}
.prod .head{display:flex;gap:16px;align-items:center;padding:20px 20px 14px}
.prod .pimg{flex:none;width:86px;height:104px;border-radius:18px;background:var(--mint);display:grid;place-items:center}
.prod .pimg svg{width:58px;height:84px}
.prod .tag{font-size:11.5px;font-weight:700;color:var(--sky-d)}
.prod .nm{font-size:21px;font-weight:900;letter-spacing:-.03em;margin:2px 0 4px}
.prod .why{font-size:12.5px;color:var(--sub)}
.prod .body{padding:0 20px 18px;font-size:14px;line-height:1.65;color:#33424B;word-break:keep-all}
.prod .body .pn{margin-top:8px;font-size:12.5px;color:var(--warn-ink)}
.qrrow{display:flex;gap:16px;align-items:center;border-top:1px dashed var(--line);padding:16px 20px;background:#FBFDFE}
.qr{flex:none;width:108px;height:108px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.qr svg{width:100%;height:100%;display:block}
.qrtxt{flex:1;font-size:13px;color:var(--sub);line-height:1.5}
.qrtxt b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px}
.qrtxt a{display:inline-flex;margin-top:10px;font-size:13px;font-weight:700;color:#fff;background:var(--sky);border-radius:10px;padding:8px 12px;text-decoration:none}
.reel{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.reel .qr{width:84px;height:84px;padding:6px;border-radius:12px}
.reel a{color:var(--sky-d);font-weight:700;font-size:13px;text-decoration:none}
.stopcard{background:var(--warn);color:var(--warn-ink);border-radius:22px;padding:18px 20px;font-size:14.5px;line-height:1.6;margin-bottom:14px}
.actions{display:grid;gap:10px;margin-top:6px}
img{mix-blend-mode:multiply}
.hero .art img,.qart img{mix-blend-mode:normal}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>

const app = document.getElementById('app');
let S = {view:'home'};
const back = () => history.back();

function go(next, push=true){
  S = next;
  if(push) history.pushState(S,''); else history.replaceState(S,'');
  render(); window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('popstate', e => { S = e.state || {view:'home'}; render(); });

const catIdx = id => DATA.cats.findIndex(c=>c.id===id)+1;
const stainsOf = cid => DATA.stains.filter(s=>s.cat===cid);
const stainNo = s => `${catIdx(s.cat)}-${stainsOf(s.cat).indexOf(s)+1}`;
const getStain = id => DATA.stains.find(s=>s.id===id);
function getMethod(s, b){
  if(s.branch){ const o=s.branch.options[b]; return {...o.method, warn:[...(s.warn||[]),...o.method.warn], reel:o.method.reel||s.reel, stop:o.stop}; }
  return {...s.method, reel:s.method.reel};
}
const esc = t => String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chev = `<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>`;

function topBar(){
  if(S.view==='home') return '';
  return `<header class="top"><button class="back" onclick="back()" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="brand" onclick="go({view:'home'})">때를 아는 <span>세탁</span></button></header>`;
}
function crumbs(){
  const c=[];
  if(S.cat){ const cat=DATA.cats.find(x=>x.id===S.cat); c.push(`<span class="chip"><b>${catIdx(S.cat)}</b>${cat.name}</span>`); }
  if(S.stain){ const s=getStain(S.stain); c.push(`<span class="chip"><b>${stainNo(s)}</b>${s.name}</span>`);
    if(s.branch && S.b!=null) c.push(`<span class="chip"><b>${stainNo(s)}-${S.b+1}</b>${s.branch.options[S.b].label}</span>`); }
  return c.length?`<div class="crumbs">${c.join('')}</div>`:'';
}

function vHome(){
  return `<div class="hero view">
    <div class="art"><img src="${IMG.coffee}" alt=""><img src="${IMG.ink}" alt=""><img src="${IMG.wine}" alt=""></div>
    <div class="eyebrow">땡스맘의 얼룩별 세탁 공식</div>
    <h1>어떤 얼룩이<br>묻었나요?</h1>
    <p class="lead" style="margin-top:10px">얼룩 종류를 차례로 고르면<br>단계별 세탁법과 추천 제품을 알려 드려요.</p>
    <div class="rules">
      <div class="rule"><i>🚫</i>물티슈<br>금지</div>
      <div class="rule"><i>🔥</i>뜨거운 물<br>금지</div>
      <div class="rule"><i>⏱️</i>최대한<br>빨리</div>
    </div>
    <button class="cta" onclick="go({view:'cats'})">시작하기 ${chev.replace('class="arrow"','style="color:#fff"')}</button>
  </div>
  <div class="foot">『때를 아는 세탁』 · 조용미(땡스맘)<br>얼룩이 오래될수록 반복과 시간이 필요해요.</div>`;
}

function vCats(){
  return `<div class="view">${crumbs()}
    <div class="eyebrow">STEP 1</div><h2>오염 종류를 골라 주세요</h2>
    <p class="lead">얼룩이 어디서 생겼는지에 따라 나눴어요.</p>
    <div class="list">${DATA.cats.map((c,i)=>`
      <button class="opt" onclick="go({view:'stains',cat:'${c.id}'})">
        <span class="thumb"><img src="${IMG[c.img]}" alt=""></span>
        <span class="t"><b>${c.name}</b><small>${c.desc}</small></span>
        <span class="num">${i+1}</span>
      </button>`).join('')}
    </div></div>`;
}

function vStains(){
  const list=stainsOf(S.cat);
  return `<div class="view">${crumbs()}
    <div class="eyebrow">STEP 2</div><h2>어떤 얼룩인가요?</h2>
    <p class="lead">가장 비슷한 얼룩을 눌러 주세요.</p>
    <div class="grid">${list.map(s=>`
      <button class="tile" onclick="pickStain('${s.id}')">
        <div class="pic"><img src="${IMG[s.img]}" alt=""></div>
        <span class="num">${stainNo(s)}</span>
        ${s.branch?`<span class="split">${s.branch.options.length}가지</span>`:''}
        <b>${s.name}</b><small>${s.sub}</small>
      </button>`).join('')}
    </div></div>`;
}
function pickStain(id){
  const s=getStain(id);
  if(s.branch) go({view:'branch',cat:s.cat,stain:id});
  else go({view:'steps',cat:s.cat,stain:id,i:0});
}

function vBranch(){
  const s=getStain(S.stain);
  return `<div class="view">${crumbs()}
    <div class="qart"><img src="${IMG[s.img]}" alt=""></div>
    <div class="eyebrow">STEP 3</div><h2>${s.branch.q}</h2>
    <p class="lead">선택에 따라 세탁법이 달라져요.</p>
    <div class="list">${s.branch.options.map((o,k)=>`
      <button class="opt" onclick="go({view:'steps',cat:'${s.cat}',stain:'${s.id}',b:${k},i:0})">
        <span class="num">${stainNo(s)}-${k+1}</span>
        <span class="t"><b>${o.label}</b><small>${o.desc}</small></span>${chev}
      </button>`).join('')}
    </div></div>`;
}

function vSteps(){
  const s=getStain(S.stain), m=getMethod(s,S.b), n=m.steps.length, i=S.i;
  const last=i===n-1;
  const notes = last ? [...m.warn.map(w=>`<div class="note w"><b>⚠️</b><span>${esc(w)}</span></div>`), ...m.tip.map(t=>`<div class="note t"><b>💡</b><span>${esc(t)}</span></div>`)].join('') : '';
  return `<div class="view">${crumbs()}
    <div class="progress">${m.steps.map((_,k)=>`<span class="${k<=i?'on':''}"></span>`).join('')}</div>
    <div class="stepcard">
      <div class="pic"><img src="${IMG[s.img]}" alt=""></div>
      <div class="stepno">STEP ${i+1} <em>/ ${n}</em></div>
      <p class="steptext">${esc(m.steps[i])}</p>
    </div>
    ${notes?`<div class="notes">${notes}</div>`:''}
    <div class="nav">
      <button class="ghost" onclick="${i===0?'back()':`go({...S,i:${i-1}},false)`}">이전</button>
      <button class="cta ${last?'sky':''}" onclick="${last?`go({...S,view:'result'})`:`go({...S,i:${i+1}},false)`}">${last?(m.stop?'정리 보기':'추천 제품 보기'):'다음 단계'}</button>
    </div>
    <div class="dots">${m.steps.map((t,k)=>`<button class="mini ${k===i?'cur':''}" onclick="go({...S,i:${k}},false)"><i>${k+1}</i><span>${esc(t)}</span></button>`).join('')}</div>
  </div>`;
}

function vResult(){
  const s=getStain(S.stain), m=getMethod(s,S.b);
  const label = s.name + (s.branch? ` · ${s.branch.options[S.b].label}`:'');
  let html = `<div class="view">${crumbs()}<div class="done"><span class="badge">✓ ${esc(label)} 세탁법 완료</span>`;
  if(m.stop){
    html += `<h2>이 옷은 집에서<br>무리하지 마세요</h2></div><div class="stopcard">${m.steps.map(esc).join('<br><br>')}</div>`;
  } else {
    html += `<h2>이 제품을 사용하는 게<br>좋아요</h2><p class="lead">${esc(s.name)} 얼룩엔 이렇게 준비해 두세요.</p></div>`;
    html += m.product.map((pid,k)=>{
      const p=DATA.products[pid];
      return `<div class="prod">
        <div class="head"><div class="pimg">${PROD_SVG[pid]}</div>
          <div><div class="tag">${k===0?'추천 1순위':'함께 쓰면 좋아요'} · ${esc(p.tag)}</div><div class="nm">${esc(p.name)}</div></div></div>
        <div class="body">${esc(p.desc)}<div class="pn">${esc(p.note)}</div></div>
        <div class="qrrow"><div class="qr">${QR['p_'+pid]}</div>
          <div class="qrtxt"><b>QR로 바로 구매하기</b>휴대폰 카메라로 찍으면 제품 페이지로 연결돼요.<br><a href="${p.url}" target="_blank" rel="noopener">제품 보러 가기 →</a></div></div>
      </div>`;}).join('');
  }
  if(m.reel){
    html += `<div class="reel"><div class="qr">${QR['r_'+m.reel]}</div><div class="qrtxt"><b>영상으로 보고 싶다면?</b>땡스맘 인스타그램 릴스로 연결돼요.<br><a href="${m.reel}" target="_blank" rel="noopener" style="background:none;color:var(--sky-d);padding:0">릴스 보러 가기 →</a></div></div>`;
  }
  html += `<div class="actions">
    <button class="cta" onclick="go({view:'steps',cat:'${s.cat}',stain:'${s.id}',${S.b!=null?`b:${S.b},`:''}i:0})">세탁법 다시 보기</button>
    <button class="ghost" onclick="go({view:'cats'})">다른 얼룩 찾기</button>
  </div></div>`;
  return html;
}

function render(){
  const v = {home:vHome,cats:vCats,stains:vStains,branch:vBranch,steps:vSteps,result:vResult}[S.view]||vHome;
  app.innerHTML = topBar() + v() + (S.view!=='home'?`<div class="foot">『때를 아는 세탁』 · 조용미(땡스맘)</div>`:'');
}
history.replaceState(S,'');
render();
</script>
</body>
</html>
