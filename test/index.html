<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 얼룩 유형 테스트</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root{
    --yellow:#ffe17c;
    --charcoal:#171e19;
    --sage:#b7c6c2;
    --white:#ffffff;
    --black:#000000;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--charcoal);
    font-family:'Pretendard Variable', 'Pretendard', sans-serif;
    color:var(--black);
    display:flex;
    justify-content:center;
    padding:32px 16px;
  }
  .app{
    width:100%;
    max-width:480px;
  }
  .card{
    background-color:var(--yellow);
    background-image:radial-gradient(rgba(0,0,0,0.14) 1.5px, transparent 1.5px);
    background-size:32px 32px;
    border:2px solid var(--black);
    border-radius:24px;
    box-shadow:8px 8px 0px 0px var(--black);
    padding:36px 28px;
    position:relative;
  }
  h1{
    font-family:'Pretendard Variable', sans-serif;
    font-weight:800;
    letter-spacing:-0.02em;
    font-size:26px;
    line-height:1.35;
    margin:0 0 10px;
    text-align:center;
    color:var(--black);
  }
  .sub{
    text-align:center;
    color:var(--black);
    opacity:0.72;
    font-weight:600;
    font-size:14.5px;
    margin:0 0 24px;
    line-height:1.6;
  }
  .cover-photo{
    width:116px;
    height:116px;
    border-radius:18px;
    overflow:hidden;
    margin:0 auto 18px;
    border:2.5px solid var(--black);
    box-shadow:6px 6px 0px 0px var(--black);
    background:var(--white);
  }
  .cover-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .tag-row{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:26px;
  }
  .tag{
    background:var(--white);
    border:2px solid var(--black);
    color:var(--black);
    font-size:12px;
    font-weight:700;
    padding:6px 12px;
    border-radius:20px;
    box-shadow:3px 3px 0px 0px var(--black);
  }
  button{
    font-family:'Pretendard Variable', sans-serif;
    cursor:pointer;
    border:none;
  }
  .btn-main{
    width:100%;
    padding:16px;
    border-radius:12px;
    background:var(--black);
    color:var(--white);
    border:2px solid var(--black);
    font-size:16px;
    font-weight:800;
    box-shadow:8px 8px 0px 0px var(--black);
    transition:transform .18s cubic-bezier(.175,.885,.32,1.275), box-shadow .18s ease;
  }
  .btn-main:hover{
    transform:translate(4px,4px);
    box-shadow:4px 4px 0px 0px var(--black);
  }
  .btn-ghost{
    width:100%;
    margin-top:12px;
    padding:14px;
    border-radius:12px;
    background:var(--white);
    color:var(--black);
    border:2px solid var(--black);
    font-size:15px;
    font-weight:800;
    box-shadow:4px 4px 0px 0px var(--black);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-ghost:hover{
    transform:translate(3px,3px);
    box-shadow:1px 1px 0px 0px var(--black);
  }
  .btn-back{
    background:var(--white);
    color:var(--black);
    font-size:13px;
    font-weight:700;
    padding:7px 12px;
    margin-bottom:14px;
    border-radius:20px;
    border:2px solid var(--black);
    box-shadow:3px 3px 0px 0px var(--black);
    display:inline-flex;
    align-items:center;
    gap:4px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-back:hover{
    transform:translate(2px,2px);
    box-shadow:1px 1px 0px 0px var(--black);
  }

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .progress-track{
    flex:1;
    height:10px;
    background:var(--white);
    border:2px solid var(--black);
    border-radius:8px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--black);
    transition:width .35s ease;
  }
  .progress-num{
    font-size:13px;
    font-weight:800;
    color:var(--black);
    white-space:nowrap;
  }

  .q-title{
    font-family:'Pretendard Variable', sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
    font-size:20px;
    line-height:1.5;
    margin:0 0 22px;
    color:var(--black);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .opt{
    text-align:left;
    background:var(--white);
    border:2px solid var(--black);
    border-radius:12px;
    padding:16px 18px;
    font-size:15px;
    font-weight:600;
    color:var(--black);
    box-shadow:4px 4px 0px 0px var(--black);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .opt:hover{
    background:var(--sage);
    transform:translate(4px,4px);
    box-shadow:0px 0px 0px 0px var(--black);
  }

  .result-emoji{
    font-size:64px;
    text-align:center;
    margin-bottom:6px;
  }
  .result-badge{
    display:block;
    text-align:center;
    font-size:13px;
    font-weight:800;
    color:var(--black);
    background:var(--white);
    border:2px solid var(--black);
    border-radius:20px;
    padding:6px 14px;
    width:fit-content;
    margin:0 auto 14px;
    box-shadow:3px 3px 0px 0px var(--black);
  }
  .result-title{
    font-family:'Pretendard Variable', sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
    font-size:24px;
    text-align:center;
    color:var(--black);
    margin:0 0 16px;
  }
  .result-desc{
    font-size:14.5px;
    font-weight:500;
    line-height:1.7;
    color:var(--black);
    background:var(--white);
    border:2px solid var(--black);
    border-radius:16px;
    padding:16px 18px;
    box-shadow:4px 4px 0px 0px var(--black);
    margin-bottom:18px;
  }
  .section-label{
    font-size:13.5px;
    font-weight:800;
    color:var(--black);
    margin:0 0 8px;
  }
  .reason-list{
    margin:0 0 18px;
    padding-left:20px;
    font-size:14px;
    font-weight:500;
    line-height:1.9;
    color:var(--black);
    opacity:0.85;
  }
  .tip-box{
    border:2px dashed var(--black);
    background:var(--sage);
    border-radius:16px;
    padding:14px 16px;
    font-size:14px;
    font-weight:600;
    line-height:1.7;
    color:var(--black);
    margin-bottom:18px;
  }
  .product-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .product-card{
    background:var(--white);
    border:2px solid var(--black);
    border-radius:14px;
    padding:12px 14px;
    box-shadow:3px 3px 0px 0px var(--black);
  }
  .product-step{
    display:inline-block;
    font-size:11px;
    font-weight:800;
    color:var(--white);
    background:var(--black);
    padding:2px 8px;
    border-radius:10px;
    margin-bottom:6px;
    letter-spacing:0.02em;
  }
  .product-name{
    font-size:14.5px;
    font-weight:800;
    color:var(--black);
    margin:0 0 4px;
  }
  .product-note{
    font-size:12.5px;
    font-weight:500;
    color:var(--black);
    opacity:0.78;
    line-height:1.55;
    margin:0;
  }
  .product-link{
    display:inline-block;
    margin-top:8px;
    font-size:12px;
    font-weight:800;
    color:var(--black);
    background:var(--yellow);
    border:2px solid var(--black);
    border-radius:8px;
    padding:5px 10px;
    box-shadow:2px 2px 0px 0px var(--black);
  }

  .bars{
    margin-bottom:22px;
  }
  .bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
    font-size:12.5px;
    font-weight:700;
    color:var(--black);
  }
  .bar-label{ width:104px; flex-shrink:0; }
  .bar-track{
    flex:1;
    height:12px;
    background:var(--white);
    border:2px solid var(--black);
    border-radius:0px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:var(--black);
  }
  .bar-pct{ width:34px; text-align:right; flex-shrink:0; }

  .cta-box{
    background:var(--charcoal);
    border:2px solid var(--black);
    border-radius:16px;
    padding:20px;
    color:var(--white);
    text-align:center;
    margin-bottom:14px;
    box-shadow:6px 6px 0px 0px var(--black);
  }
  .cta-box p{
    margin:0 0 12px;
    font-size:14px;
    font-weight:600;
    line-height:1.6;
    color:var(--white);
  }
  .cta-btn{
    display:inline-block;
    background:var(--yellow);
    color:var(--black);
    font-weight:800;
    font-size:15px;
    padding:12px 22px;
    border-radius:10px;
    border:2px solid var(--black);
    box-shadow:4px 4px 0px 0px rgba(255,255,255,0.9);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cta-btn:hover{
    transform:translate(3px,3px);
    box-shadow:1px 1px 0px 0px rgba(255,255,255,0.9);
  }
  .footer-note{
    text-align:center;
    font-size:12px;
    font-weight:600;
    color:var(--sage);
    margin-top:6px;
  }
  [hidden]{ display:none !important; }
</style>
</head>

/* 결과 표시 시 동점 처리를 위한 우선순위 */
const priority = ["A","B","C","D","E"];

/* ------------------------------------------------
   3) 인스타그램 계정 정보 - 여기만 수정하면 돼요
------------------------------------------------- */
const INSTAGRAM_HANDLE = "your_laundry_account"; // 실제 계정 아이디로 교체

/* ------------------------------------------------
   4) 로직
------------------------------------------------- */
let current = 0;
let scores = { A:0, B:0, C:0, D:0, E:0 };
let answersHistory = [];

function startQuiz(){
  current = 0;
  scores = { A:0, B:0, C:0, D:0, E:0 };
  answersHistory = [];
  document.getElementById("start-screen").hidden = true;
  document.getElementById("result-screen").hidden = true;
  document.getElementById("quiz-screen").hidden = false;
  renderQuestion();
}

function renderQuestion(){
  const q = questions[current];
  document.getElementById("q-title").textContent = q.title;
  document.getElementById("progress-num").textContent = (current+1) + " / " + questions.length;
  document.getElementById("progress-fill").style.width = ((current)/questions.length*100) + "%";

  const wrap = document.getElementById("q-options");
  wrap.innerHTML = "";
  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(opt);
    wrap.appendChild(btn);
  });
}

function selectOption(opt){
  scores[opt.type] += 1;
  answersHistory[current] = opt.type;
  current++;
  if(current < questions.length){
    renderQuestion();
  } else {
    document.getElementById("progress-fill").style.width = "100%";
    showResult();
  }
}

function goBack(){
  if(current === 0){
    // 첫 질문에서 뒤로가기 -> 시작 화면으로
    document.getElementById("quiz-screen").hidden = true;
    document.getElementById("start-screen").hidden = false;
    return;
  }
  current--;
  const prevType = answersHistory[current];
  if(prevType){
    scores[prevType] -= 1;
    answersHistory[current] = null;
  }
  renderQuestion();
}

function getTopType(){
  let top = priority[0];
  priority.forEach(t => {
    if(scores[t] > scores[top]) top = t;
  });
  return top;
}

function showResult(){
  const top = getTopType();
  const r = results[top];

  document.getElementById("quiz-screen").hidden = true;
  document.getElementById("result-screen").hidden = false;

  document.getElementById("r-emoji").textContent = r.emoji;
  document.getElementById("r-badge").textContent = r.badge;
  document.getElementById("r-title").textContent = r.title;
  document.getElementById("r-desc").textContent = r.desc;

  const reasonEl = document.getElementById("r-reason");
  reasonEl.innerHTML = "";
  r.reasons.forEach(txt => {
    const li = document.createElement("li");
    li.textContent = txt;
    reasonEl.appendChild(li);
  });

  document.getElementById("r-tip").textContent = r.tip;

  const productsEl = document.getElementById("r-products");
  productsEl.innerHTML = "";
  (r.products || []).forEach(p => {
    const info = PRODUCTS[p.key];
    const card = document.createElement("div");
    card.className = "product-card";
    card.innerHTML = `
      <span class="product-step">${p.step}</span>
      <p class="product-name">${info.name}</p>
      <p class="product-note">${p.note}</p>
      <a class="product-link" href="${info.link}" target="_blank" rel="noopener">제품 보러가기</a>
    `;
    productsEl.appendChild(card);
  });

  document.getElementById("r-cta-text").textContent = r.ctaText;
  document.getElementById("r-cta-btn").href = "https://instagram.com/" + INSTAGRAM_HANDLE;

  // 분포 바 차트
  const total = Object.values(scores).reduce((a,b)=>a+b,0) || 1;
  const barsEl = document.getElementById("r-bars");
  barsEl.innerHTML = "";
  priority.forEach(t => {
    const pct = Math.round(scores[t]/total*100);
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <span class="bar-label">${results[t].emoji} ${results[t].badge}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
      <span class="bar-pct">${pct}%</span>
    `;
    barsEl.appendChild(row);
  });
}

function restartQuiz(){
  document.getElementById("result-screen").hidden = true;
  document.getElementById("start-screen").hidden = false;
}

</script>

</body>
</html>
